name: Deploy
on:
  # schedule:
  #   - cron: '0 0 1 * *' # Runs at 00:00 on the 1st of every month
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno task fetchRepos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: deno task captureScreenshots

      - name: Commit screenshots
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add screenshots/
          git commit -m "Update screenshots" || echo "No changes to commit"
          git push || echo "No changes to commit"

      - name: Build step
        run: "deno task build"

      # Deno gestiona node_modules (nodeModulesDir: auto) sin package.json.
      # Ese layout rompe el "npm i wrangler@4" que hace wrangler-action con
      # "Cannot read properties of null (reading 'edgesOut')". El build ya
      # terminó y el resultado está en _site/, así que se puede borrar.
      - name: Remove Deno node_modules
        run: rm -rf node_modules

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Static Assets requiere Wrangler 4 (el default de la action es 3.90)
          wranglerVersion: "4"
